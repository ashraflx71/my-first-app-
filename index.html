<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Creative 2026 - PWA</title>

    <link rel="manifest" href="manifest.json">

    <style>
        body {
            background-color: #000000; /* خلفية سوداء */
            color: #FFD700;           /* خط ذهبي */
            font-size: 20px;          /* خط كبير وواضح */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 20px;
            line-height: 1.6;
        }
        .container {
            max-width: 800px;
            margin: auto;
            border: 1px solid #FFD700;
            padding: 20px;
            border-radius: 10px;
        }
        h1 { border-bottom: 2px solid #FFD700; padding-bottom: 10px; }
    </style>
</head>
<body>

    <div class="container">
        <h1>مرحباً بك في تطبيق Creative 2026</h1>
        <p>هذا الموقع مهيأ ليعمل كتطبيق PWA على هاتفك.</p>
    </div>

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('تم تسجيل الـ Service Worker بنجاح'))
                    .catch(err => console.log('فشل التسجيل:', err));
            });
        }
    </script>

</body>
</html>
