<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تطبيق أشرف - My First App</title>
    
    <link rel="canonical" href="https://ashraflx71.github.io/my-first-app-/" />

    <style>
        /* ضع كل كود الـ CSS الخاص بك هنا */
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        .container {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            max-width: 600px;
            margin: auto;
        }
        h1 { color: #333; }
        /* أضف باقي تنسيقاتك هنا */
    </style>
</head>
<body>

    <div class="container">
        <h1>مرحباً بك في تطبيقي الأول</h1>
        <p id="message">جاري تحميل المحتوى...</p>
        
        </div>

    <script>
        // ضع كل كود الـ JavaScript الخاص بك هنا
        document.addEventListener('DOMContentLoaded', () => {
            const msg = document.getElementById('message');
            msg.innerText = "تم دمج الملفات بنجاح والعمل مستمر!";
            console.log("App is running smoothly.");
        });
        
        // أضف باقي وظائفك هنا
    </script>
</body>
</html>
