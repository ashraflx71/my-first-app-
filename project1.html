<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ساعتي الذكية - أول مشروع</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; background-color: #f4f4f4; text-align: center; }
        header { background: #2c3e50; color: white; padding: 50px 20px; }
        .product-image { width: 250px; height: 250px; background: #ddd; margin: 20px auto; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; }
        .info { padding: 40px; background: white; max-width: 600px; margin: -50px auto 50px; border-radius: 15px; box-shadow: 0 10px 20px rgba(0,0,0,0.1); }
        h1 { color: #2c3e50; }
        p { color: #666; line-height: 1.6; }
        .buy-btn { background: #e67e22; color: white; padding: 15px 30px; text-decoration: none; border-radius: 25px; font-weight: bold; display: inline-block; margin-top: 20px; transition: 0.3s; }
        .buy-btn:hover { background: #d35400; }
    </style>
</head>
<body>

<header>
    <h1>مرحباً بك في عالم التكنولوجيا</h1>
    <p>تصميم واجهة مستخدم بسيطة وأنيقة</p>
</header>

<div class="info">
    <div class="product-image">صورة المنتج هنا</div>
    <h2>ساعة ذكية - الإصدار الأول</h2>
    <p>هذا المشروع هو أول تجربة لي في بناء صفحات الهبوط المتجاوبة. تم استخدام HTML و CSS فقط لضمان السرعة والبساطة.</p>
    <a href="#" class="buy-btn">اطلب الآن</a>
</div>

</body>
</html>
